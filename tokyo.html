<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F7F4EE">
<title>도쿄 2박 3일 — 10/24~26 동선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bg:#F7F4EE; --surface:#FFFFFF; --surface-2:#F2EEE6; --ink:#171A1F; --ink-2:#4B5563; --muted:#8A9099; --line:#E6E1D7;
  --primary:#E85D2A; --primary-ink:#fff; --primary-soft:#FCE8DE;
  --meal:#2F5BB7; --cafe:#8A5A3B; --sight:#D9453A; --shop:#1F8A70; --museum:#6D3F9E; --park:#3C8D3F; --hotel:#E85D2A; --transit:#6B7280;
  --now:#F2C230; --me:#1A73E8; --route:#1F2937; --plan:#4B5563; --line3:#EF7C1C;
  --warn-bg:#FFF3D6; --warn-ink:#7A5200;
  --shadow:0 8px 28px rgba(23,26,31,.14); --shadow-s:0 2px 8px rgba(23,26,31,.12);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1B1E23; --surface-2:#23272E; --ink:#F1F2F4; --ink-2:#C2C7CF; --muted:#8A9099; --line:#2E333B;
    --primary:#F06B38; --primary-soft:#3A251B; --route:#E5E7EB; --plan:#9CA3AF; --warn-bg:#3A3217; --warn-ink:#F3D98B;
    --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1E23; --surface-2:#23272E; --ink:#F1F2F4; --ink-2:#C2C7CF; --muted:#8A9099; --line:#2E333B;
  --primary:#F06B38; --primary-soft:#3A251B; --route:#E5E7EB; --plan:#9CA3AF; --warn-bg:#3A3217; --warn-ink:#F3D98B;
  --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; margin:0; overscroll-behavior:none}
body{background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Gowun Dodum","Noto Sans KR",sans-serif; font-weight:400; margin:0; letter-spacing:-.01em}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---- app frame ---- */
.app{position:fixed; inset:0; overflow:hidden}
#map{position:absolute; inset:0; background:#E9E5DC}
.map-error{position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; background:var(--bg)}
.map-error.show{display:flex}
.map-error .box{max-width:360px; background:var(--surface); border-radius:var(--r); padding:22px; box-shadow:var(--shadow); text-align:center}
.map-error .box h2{font-size:18px; margin-bottom:8px}
.map-error .box p{margin:0; color:var(--ink-2); font-size:13px}

/* top bar */
.top{position:absolute; left:0; right:0; top:0; padding:calc(var(--sat) + 10px) 12px 0; pointer-events:none; z-index:5}
.top > *{pointer-events:auto}
.bar{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:999px; padding:8px 8px 8px 16px; box-shadow:var(--shadow-s); max-width:560px; margin:0 auto}
.bar .title{flex:1; min-width:0}
.bar .title h1{font-size:17px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .title .sub{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ibtn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink); font-size:18px; flex:none}
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 6px; scrollbar-width:none; max-width:560px; margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; background:var(--surface); box-shadow:var(--shadow-s); font-size:13px; font-weight:500; color:var(--ink-2); border:1.5px solid transparent}
.chip .d{width:9px; height:9px; border-radius:50%; background:var(--c)}
.chip.on{border-color:var(--c,var(--primary)); color:var(--ink); background:var(--surface)}
.chip.route.on{background:var(--route); color:var(--bg)}
.chip .cnt{font-size:11px; color:var(--muted)}

/* floating right buttons */
.fabs{position:absolute; right:12px; display:flex; flex-direction:column; gap:10px; z-index:5; transition:bottom .25s ease, opacity .2s}
.fabs.hide{opacity:0; pointer-events:none}
.fab{width:44px; height:44px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow-s); display:grid; place-items:center; font-size:19px}
.fab.on{background:var(--me); color:#fff}

/* bottom sheet */
.sheet{position:absolute; left:0; right:0; bottom:0; margin:0 auto; max-width:560px; height:212px; background:var(--surface); border-radius:22px 22px 0 0; box-shadow:0 -6px 30px rgba(0,0,0,.18); z-index:6; display:flex; flex-direction:column; transition:height .28s cubic-bezier(.2,.8,.2,1); touch-action:none}
.sheet.dragging{transition:none}
.handle{height:22px; display:grid; place-items:center; flex:none; cursor:grab}
.handle::before{content:""; width:40px; height:5px; border-radius:3px; background:var(--line)}
.sheet-head{padding:0 16px 10px; flex:none; touch-action:none}
.days{display:flex; gap:4px; background:var(--surface-2); border-radius:12px; padding:4px; margin:0 0 10px}
.days button{flex:1; padding:6px 4px; border-radius:9px; font-size:12.5px; color:var(--muted); line-height:1.25}
.days button b{display:block; font-weight:600; font-size:13px}
.days button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-s)}
.clockrow{display:flex; align-items:center; gap:12px}
.clock{font-family:"Gowun Dodum",sans-serif; font-size:30px; line-height:1; font-variant-numeric:tabular-nums; min-width:84px}
.status{flex:1; min-width:0; font-size:12.5px; color:var(--ink-2); line-height:1.35}
.status b{color:var(--ink); font-weight:600}
.status .geo{display:block; color:var(--me); font-size:11.5px; margin-top:2px}
.playbtn{width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:14px; flex:none}
.tl{position:relative; height:34px; margin-top:8px; border-radius:10px; background:var(--surface-2); overflow:hidden; touch-action:none}
.tl .blk{position:absolute; top:9px; height:16px; border-radius:4px}
.tl .blk.move{top:13px; height:8px; background:var(--line)}
.tl .blk.move.transit{background:repeating-linear-gradient(90deg,var(--line3) 0 4px,transparent 4px 7px)}
.tl .blk.free{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 7px)}
.tl .tick{position:absolute; top:0; bottom:0; width:1px; background:rgba(0,0,0,.06)}
.tl .tick span{position:absolute; top:0; left:3px; font-size:9px; color:var(--muted)}
.tl .cur{position:absolute; top:0; bottom:0; width:2px; background:var(--now)}
.tl .cur::after{content:""; position:absolute; top:-1px; left:-6px; width:14px; height:14px; border-radius:50%; background:var(--now); box-shadow:0 0 0 2px var(--surface)}
.sheet-body{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; touch-action:pan-y; padding:0 16px calc(var(--sab) + 24px)}
.tabs{display:flex; gap:6px; background:var(--surface-2); border-radius:12px; padding:4px; margin:4px 0 12px; position:sticky; top:0; z-index:2}
.tabs button{flex:1; padding:8px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--muted)}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-s)}
.pane{display:none} .pane.on{display:block}

/* place card */
.card{display:none; background:var(--surface-2); border-radius:var(--r); padding:14px 14px 12px; margin:4px 0 14px; position:relative}
.card.show{display:block}
.card .x{position:absolute; right:10px; top:8px; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:var(--muted); font-size:16px}
.card .cat{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); background:var(--surface); padding:3px 9px; border-radius:999px}
.card .cat i{width:8px; height:8px; border-radius:50%; background:var(--c)}
.card h3{font-size:18px; margin:8px 0 2px; padding-right:28px}
.card .meta{font-size:12.5px; color:var(--ink-2)}
.card .tags{font-size:12.5px; color:var(--muted); margin-top:4px}
.card .warn{display:inline-block; margin-top:6px; font-size:11.5px; color:var(--warn-ink); background:var(--warn-bg); padding:3px 9px; border-radius:8px}
.card .act{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:12px; font-size:13.5px; font-weight:600; background:var(--primary); color:#fff; flex:1; min-width:120px}
.btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:500}
.btn.done{background:var(--ink); color:var(--bg)}
.links{display:flex; gap:12px; margin-top:10px; font-size:12px}
.links a{color:var(--ink-2); text-decoration:none; border-bottom:1px dotted var(--muted)}

/* itinerary */
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; margin:0 0 12px}
.seg button{padding:6px 12px; border-radius:8px; font-size:12.5px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-s)}
.note{font-size:12.5px; background:var(--warn-bg); color:var(--warn-ink); padding:8px 12px; border-radius:10px; margin:0 0 10px}
.note.soft{background:var(--surface-2); color:var(--ink-2)}
.dayhead{margin:0 0 10px}
.dayhead h2{font-size:16px}
.dayhead p{margin:4px 0 0; font-size:12.5px; color:var(--ink-2)}
.it{list-style:none; margin:0; padding:0}
.it li{display:grid; grid-template-columns:44px 1fr; gap:10px; position:relative}
.it li .t{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:14px; text-align:right}
.it li.stay .t{color:var(--ink-2); font-weight:500}
.it .stop{display:flex; gap:12px; align-items:flex-start; background:var(--surface-2); border-radius:16px; padding:12px; margin:4px 0; border:1.5px solid transparent; cursor:pointer}
.it li.now .stop{border-color:var(--now); box-shadow:0 0 0 3px rgba(242,194,48,.25)}
.it .ic{width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font-size:19px; background:var(--c); color:#fff; flex:none}
.it .ic span{font-size:10px; font-weight:700; line-height:1; margin-top:-2px}
.it .body{flex:1; min-width:0}
.it .nm{font-weight:600; font-size:14.5px; line-height:1.3}
.it .sub{font-size:12px; color:var(--ink-2); margin-top:2px}
.it .sub2{font-size:11.5px; color:var(--muted)}
.it li.mv .m{font-size:12px; color:var(--muted); padding:6px 0 6px 14px; position:relative}
.it li.mv .m::before{content:""; position:absolute; left:3px; top:0; bottom:0; border-left:2px dashed var(--line)}
.it li.mv.transit .m::before{border-color:var(--line3)}
.it li.mv.now .m{color:var(--ink)}
.it li.free .m{font-size:12px; color:var(--muted); padding:6px 0 6px 14px}
.it .nav{color:var(--primary); text-decoration:none; font-weight:600; margin-left:4px; white-space:nowrap}
.trail{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); background:var(--surface-2); border-radius:10px; padding:8px 12px; margin:0 0 10px}
.trail span{flex:1; min-width:160px} .trail b{color:var(--me)}
.trail button{font-size:12px; padding:5px 10px; border-radius:8px; background:var(--surface); border:1px solid var(--line)}
.endrow{font-size:12px; color:var(--muted); margin:10px 0 0 54px}
.allroute{display:block; text-align:center; margin:16px 0 0; padding:11px; border-radius:12px; border:1px solid var(--line); font-size:13px; text-decoration:none; color:var(--ink-2)}

/* places */
.ph{display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px}
.ph h3{font-size:15px; display:flex; align-items:center; gap:8px}
.ph h3 i{width:10px; height:10px; border-radius:50%; background:var(--c)}
.ph .when{font-size:12px; color:var(--muted)}
.pl{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.pc{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; background:var(--surface-2); border-radius:14px; padding:11px 12px; border:1.5px solid transparent}
.pc.sel{border-color:var(--c)}
.pc .nm{font-weight:600; font-size:14px}
.pc .hrs{font-size:12px; color:var(--ink-2)}
.pc .tg{font-size:11.5px; color:var(--muted); margin-top:1px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.pc .dist{font-size:11px; color:var(--muted); text-align:right; line-height:1.3}
.pc .pick{margin-top:6px; width:34px; height:34px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line); display:grid; place-items:center; font-size:15px; margin-left:auto}
.pc.sel .pick{background:var(--c); border-color:var(--c); color:#fff}
.pc .wn{font-size:11px; color:var(--warn-ink)}
.catfilter{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px}
.catfilter button{padding:6px 11px; border-radius:999px; font-size:12.5px; background:var(--surface-2); color:var(--ink-2); border:1.5px solid transparent}
.catfilter button.on{border-color:var(--c); color:var(--ink)}

/* google overlay markers */
.gm{position:absolute; transform:translate(-50%,-50%); pointer-events:none}
.gm.click{pointer-events:auto; cursor:pointer}
.gm.ab{transform:translate(-50%,-100%)}
.gm.al{transform:translate(-7px,-50%)}
.pin-wrap{display:flex; flex-direction:column; align-items:center; gap:2px}
.pin-wrap svg{display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.gm-lbl{ white-space:nowrap; background:rgba(255,255,255,.95); color:#171A1F; font-size:11px; font-weight:600; padding:2px 7px; border-radius:7px; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.gm-lbl small{display:block; font-weight:400; color:#4B5563; font-size:10px}
.dotm{display:flex; align-items:center; gap:5px}
.dotm i{width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--c); box-shadow:0 1px 3px rgba(0,0,0,.3); flex:none}
.dotm span{white-space:nowrap; background:rgba(255,255,255,.92); color:#171A1F; font-size:10.5px; padding:1px 6px; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.dotm.sel i{background:var(--c)}
.stm{width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--transit); box-shadow:0 1px 2px rgba(0,0,0,.3)}
.nowm{width:18px; height:18px; border-radius:50%; background:var(--now); border:2.5px solid #171A1F; box-shadow:0 0 0 6px rgba(242,194,48,.3)}
@media (prefers-reduced-motion:no-preference){ .nowm{animation:pulse 1.6s ease-out infinite} @keyframes pulse{0%{box-shadow:0 0 0 4px rgba(242,194,48,.45)}100%{box-shadow:0 0 0 16px rgba(242,194,48,0)}} }
.mem{width:18px; height:18px; border-radius:50%; background:var(--me); border:3px solid #fff; box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
@media (min-width:700px){ .sheet{border-radius:22px 22px 0 0} }
</style>
</head>
<body>
<div class="app">
  <div id="map" aria-label="동선 지도"></div>
  <div class="map-error" id="mapError"><div class="box"><h2>지도를 불러오지 못했어요</h2><p id="mapErrorMsg"></p></div></div>

  <div class="top">
    <div class="bar">
      <div class="title"><h1>도쿄 2박 3일</h1><div class="sub" id="barsub">10/24 토 – 10/26 월 · 스파블릭 인 캡슐 하타고 아카사카</div></div>
      <button class="ibtn" id="fitBtn" title="오늘 동선 전체 보기" aria-label="오늘 동선 전체 보기">⤢</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="지도에 표시할 항목"></div>
  </div>

  <div class="fabs" id="fabs">
    <button class="fab" id="geoBtn" title="내 위치" aria-label="내 위치 표시" aria-pressed="false">◎</button>
  </div>

  <section class="sheet" id="sheet" data-state="peek" aria-label="일정 패널">
    <div class="handle" id="handle" role="button" aria-label="패널 펼치기/접기" tabindex="0"></div>
    <div class="sheet-head">
      <div class="days" id="days" role="group" aria-label="날짜 선택"></div>
      <div class="clockrow">
        <div class="clock" id="clock">11:00</div>
        <div class="status" id="status"></div>
        <button class="playbtn" id="play" aria-label="시간 재생">▶</button>
      </div>
      <div class="tl" id="tl" aria-hidden="true"></div>
      <input class="sr" type="range" id="range" min="0" max="1440" value="0" aria-label="시각 선택">
    </div>
    <div class="sheet-body" id="body">
      <div class="card" id="card"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="it" class="on">일정</button>
        <button role="tab" data-tab="pl">주변 카페·대안</button>
      </div>
      <div class="pane on" id="pane-it">
        <div class="dayhead" id="dayhead"></div>
        <button class="seg" id="nowBtn" type="button"><span class="on">현재 시각으로</span></button>
        <div id="trailrow"></div>
        <div id="notes"></div>
        <ol class="it" id="it"></ol>
        <a class="allroute" id="allroute" target="_blank" rel="noopener">오늘 동선을 Google 지도 앱에서 열기</a>
      </div>
      <div class="pane" id="pane-pl">
        <div class="catfilter" id="catfilter"></div>
        <div id="plist"></div>
      </div>
    </div>
  </section>
</div>

<script>
/* ===================== 장소 데이터 ===================== */
/* cat: hotel 숙소 · meal 식사 · cafe 카페 · park 공원 · sight 구경 · shop 산책/쇼핑 · museum 미술관 · transit 역/공항 */
const P = {
  hnd:          {name:'하네다공항 T3', lat:35.5445, lng:139.7683, cat:'transit', hours:'아시아나 체크인 마감 출발 60분 전(18:05)', tags:'게이큐·아사쿠사선 직통 승강장은 지하 2층'},
  asakusa_st:   {name:'아사쿠사역 (아사쿠사선)', lat:35.7111, lng:139.7978, cat:'transit', hours:'—', tags:'A2b 출구 → 호스텔 도보 12분'},
  hostel:       {name:'스파블릭 인 캡슐 하타고 아카사카', lat:35.6752, lng:139.7365, cat:'hotel', hours:'체크인 15:00~ · 체크아웃 ~11:00 · 24시간 프런트', tags:'赤坂3-10-4 3F · 아카사카미츠케역 3분(긴자선·마루노우치선) · 나가타초역 8분(한조몬·난보쿠·유라쿠초선) · 대욕장·사우나 · 짐 보관'},

const WALK_MPM=70, ROUTE_FACTOR=1.3;
function hav(a,b){ const R=6371000,toR=Math.PI/180; const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR; const s=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const walkDist=(a,b)=>hav(a,b)*ROUTE_FACTOR;
const walkMinEst=(a,b)=>Math.max(1,Math.ceil(walkDist(a,b)/WALK_MPM));
const LEG_LS='tokyo-legs-v1'; let legCache={};
try{ legCache=JSON.parse(localStorage.getItem(LEG_LS)||'{}')||{}; }catch(e){ legCache={}; }
const legKey=(a,b)=>`${a.lat.toFixed(5)},${a.lng.toFixed(5)}>${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
const legInfo=(a,b)=>{ const l=legCache[legKey(a,b)]; return (l&&l.src==='google')? l : null; };
const walkMin=(a,b)=>{ const l=legInfo(a,b); return l? Math.max(1,l.mins) : walkMinEst(a,b); };
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function viaPath(from,to,via,total){
  const pts=[from,...(via||[]).map(v=>({lat:v[0],lng:v[1]})),to];
  const d=[0]; for(let i=1;i<pts.length;i++) d.push(d[i-1]+hav(pts[i-1],pts[i]));
  const tot=d[d.length-1]||1;
  return pts.map((q,i)=>({lat:q.lat,lng:q.lng,t:total*d[i]/tot,m:'x'}));
}
function buildPlan(dayN){
  const day=DAYS.find(d=>d.n===dayN)||DAYS[0];
  const segs=[], notes=[];
  day.items.forEach(it=>{
    if(it[0]==='stay') segs.push({kind:'stay', place:P[it[1]], start:it[2], end:it[3], label:it[4]});
    else if(it[0]==='free') segs.push({kind:'free', place:P[it[1]], start:it[2], end:it[3], label:it[4]});
    else { const from=P[it[2]], to=P[it[3]], mode=it[1]; const path=viaPath(from,to,it[7],it[5]-it[4]); path.forEach(q=>q.m=mode);
      segs.push({kind:'move', mode, from, to, start:it[4], end:it[5], path, label:it[6]}); }
  });
  const stops=[]; segs.forEach(s=>{ if(s.kind==='stay' && s.place.cat!=='transit' && !stops.includes(s.place)) stops.push(s.place); });
  const stations=[]; segs.forEach(s=>{ if(s.kind==='move'&&s.mode==='transit'){ [s.from,s.to].forEach(p=>{ if(p.cat==='transit'&&!stations.includes(p)) stations.push(p); }); } });
  return {day, segs, notes, stops, stations, t0:day.t0, end:segs[segs.length-1].end, t1:Math.max(day.t1, segs[segs.length-1].end)};
}
function posAt(plan,t){
  for(const s of plan.segs){
    if(t<s.start) continue;
    if(t>=s.end && s!==plan.segs[plan.segs.length-1]) continue;
    if(s.kind!=='move') return {lat:s.place.lat, lng:s.place.lng, seg:s};
    const el=t-s.start, p=s.path;
    for(let i=1;i<p.length;i++){ if(el<=p[i].t){ const a=p[i-1], b=p[i], f=(b.t===a.t)?1:(el-a.t)/(b.t-a.t); return {lat:a.lat+(b.lat-a.lat)*f, lng:a.lng+(b.lng-a.lng)*f, seg:s}; } }
    return {lat:s.to.lat, lng:s.to.lng, seg:s};
  }
  const f=plan.segs[0]; return {lat:f.place.lat, lng:f.place.lng, seg:null, before:true};
}

    onAdd(){ const d=document.createElement('div'); d.className='gm '+(this.onClick?'click ':'')+(this.cls||''); d.innerHTML=this.html; d.style.zIndex=this.z;
      if(this.onClick){ d.addEventListener('click',e=>{ e.stopPropagation(); this.onClick(); }); google.maps.OverlayView.preventMapHitsAndGesturesFrom(d); }
      this.div=d; this.getPanes()[this.onClick?'overlayMouseTarget':'overlayLayer'].appendChild(d); }
    draw(){ const pr=this.getProjection(); if(!pr||!this.div) return; const p=pr.fromLatLngToDivPixel(new google.maps.LatLng(this.pos.lat,this.pos.lng)); if(!p) return; this.div.style.left=p.x+'px'; this.div.style.top=p.y+'px'; }
    onRemove(){ if(this.div&&this.div.parentNode) this.div.parentNode.removeChild(this.div); this.div=null; }

/* ===================== 실제 도보 경로 (Google Routes) ===================== */
function detailPaths(plan){
  plan.segs.filter(s=>s.kind==='move'&&s.mode==='walk').forEach(s=>{
    const out=[s.path[0]];
    for(let i=1;i<s.path.length;i++){
      const a=s.path[i-1], b=s.path[i];
      const li=legInfo(a,b);
      if(li && li.path && li.path.length>2){
        const pts=li.path, d=[0];
        for(let k=1;k<pts.length;k++) d.push(d[k-1]+hav({lat:pts[k-1][0],lng:pts[k-1][1]},{lat:pts[k][0],lng:pts[k][1]}));
        const tot=d[d.length-1]||1;
        for(let k=1;k<pts.length;k++) out.push({lat:pts[k][0],lng:pts[k][1],t:a.t+(b.t-a.t)*d[k]/tot,m:'walk'});
        out.push({...b}); continue;
      }
      out.push(b);
    }
    s.path=out;
  });
}
function missingLegs(plan){
  const need=[], seen=new Set();
  plan.segs.filter(s=>s.kind==='move'&&s.mode==='walk').forEach(s=>{
    for(let i=1;i<s.path.length;i++){ const a=s.path[i-1], b=s.path[i];
      if(a.lat===b.lat&&a.lng===b.lng) continue;
      const k=legKey(a,b); if(seen.has(k)) continue; seen.add(k);
      const c=legCache[k]; if(c && (c.src==='google' || (c.src==='none' && Date.now()-c.ts<86400000))) continue;
      need.push([a,b]);
    }
  });
  return need;
}
let routesLib=null, dirSvc=null, legBusy=false, legFailNote='';
async function fetchLeg(a,b){
  const o={lat:a.lat,lng:a.lng}, d={lat:b.lat,lng:b.lng};
  try{
    if(!routesLib) routesLib=await google.maps.importLibrary('routes');
    const {Route}=routesLib;
    const res=await Route.computeRoutes({origin:o, destination:d, travelMode:'WALKING', fields:['path','durationMillis','distanceMeters']});
    const r=res&&res.routes&&res.routes[0];
    if(r&&r.path&&r.path.length>1) return {src:'google', mins:Math.max(1,Math.round((Number(r.durationMillis)||0)/60000)), dist:r.distanceMeters, path:r.path.map(q=>[+q.lat().toFixed(5),+q.lng().toFixed(5)])};
  }catch(e){ console.warn('Routes JS:',e&&e.message||e); }
  try{
    if(google.maps.DirectionsService){
      dirSvc=dirSvc||new google.maps.DirectionsService();
      const res=await dirSvc.route({origin:o, destination:d, travelMode:google.maps.TravelMode.WALKING});
      const leg=res.routes[0].legs[0];
      return {src:'google', mins:Math.max(1,Math.round(leg.duration.value/60)), dist:leg.distance.value, path:res.routes[0].overview_path.map(q=>[+q.lat().toFixed(5),+q.lng().toFixed(5)])};
    }
  }catch(e){ console.warn('Directions:',e&&e.message||e); }
  return {src:'none', ts:Date.now()};
}
async function queueLegs(){
  if(!mapReady||legBusy) return;
  const need=missingLegs(plan); if(!need.length) return;
  legBusy=true; let got=0, fail=0; const dayAtStart=state.day;
  for(const [a,b] of need){ const r=await fetchLeg(a,b); legCache[legKey(a,b)]=r; if(r.src==='google') got++; else fail++; }
  try{ localStorage.setItem(LEG_LS,JSON.stringify(legCache)); }catch(e){}
  legBusy=false;
  legFailNote = fail? '일부 도보 구간은 Google 길찾기를 받지 못해 직선 추정으로 표시됩니다(Routes API 사용 설정·키 제한 확인).' : '';
  if((got||fail) && dayAtStart===state.day) recalc();
}
function legStatus(){
  let g=0, n=0;
  plan.segs.filter(s=>s.kind==='move'&&s.mode==='walk').forEach(s=>{ const a=s.from,b=s.to; if(a.lat===b.lat&&a.lng===b.lng) return; n++; if(legInfo(a,b)) g++; });
  return {g,n};
}

  const m=d.getHours()*60+d.getMinutes(); setT(Math.min(plan.t1,Math.max(plan.t0,m))); save(); tick(); });

/* ===================== 내 위치 ===================== */
let userPos=null, geoWatch=null;
function nextTarget(t){ const p=posAt(plan,t); if(!p.seg) return t<plan.segs[0].start?plan.segs[0].place:plan.stops[plan.stops.length-1]; return p.seg.kind==='move'?p.seg.to:p.seg.place; }
function drawUser(){ if(!mapReady) return; clearL(LY.user); if(!userPos) return;
  if(userPos.acc>0) LY.user.push(new google.maps.Circle({center:userPos, radius:userPos.acc, map:gmap, strokeColor:CSSV('--me'), strokeWeight:1, fillColor:CSSV('--me'), fillOpacity:.1, clickable:false}));
  const m=new HtmlMarker({lat:userPos.lat,lng:userPos.lng},'<div class="mem" title="내 위치"></div>','',null,300); m.setMap(gmap); LY.user.push(m); }
const geoBtn=document.getElementById('geoBtn');
geoBtn.addEventListener('click',()=>{
  if(geoWatch!=null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; userPos=null; drawUser(); geoBtn.classList.remove('on'); geoBtn.setAttribute('aria-pressed','false'); tick(); return; }
  if(!navigator.geolocation){ alert('이 브라우저는 위치 정보를 지원하지 않습니다.'); return; }
  geoBtn.classList.add('on'); geoBtn.setAttribute('aria-pressed','true'); let first=true;
  geoWatch=navigator.geolocation.watchPosition(pos=>{ userPos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0)}; drawUser(); addTrailPoint(userPos); tick(); if(first){ first=false; fitTo([userPos]); } },
    err=>{ alert(err.code===1?'위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.':'현재 위치를 가져오지 못했습니다.'); geoWatch=null; geoBtn.classList.remove('on'); geoBtn.setAttribute('aria-pressed','false'); },
    {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
});
document.getElementById('fitBtn').addEventListener('click',()=>{ fitTo(plan.stops); });

/* ===================== 바텀시트 ===================== */
const sheet=document.getElementById('sheet'); let sheetState='peek';
const SNAP=()=>({peek:212, half:Math.round(innerHeight*0.5), full:Math.round(innerHeight*0.88)});
const sheetPx=()=>sheet.getBoundingClientRect().height;
function setSheet(name){ sheetState=name; sheet.dataset.state=name; sheet.classList.remove('dragging'); sheet.style.height=SNAP()[name]+'px'; placeFabs(); }
function placeFabs(){ const f=document.getElementById('fabs'); f.style.bottom=(SNAP()[sheetState]+14)+'px'; f.classList.toggle('hide',sheetState==='full'); }
let drag=null;
const handle=document.getElementById('handle'), head=document.querySelector('.sheet-head');
function dragStart(e){ if(e.target.closest('#tl,#play,#days')) return; drag={y:e.clientY,h:sheetPx(),moved:false,fromHandle:!!e.target.closest('#handle')}; sheet.classList.add('dragging'); sheet.setPointerCapture(e.pointerId); }
function dragMove(e){ if(!drag) return; const dy=e.clientY-drag.y; if(Math.abs(dy)>4) drag.moved=true; const h=Math.max(120,Math.min(innerHeight*0.92,drag.h-dy)); sheet.style.height=h+'px'; }
function dragEnd(e){ if(!drag) return; const moved=drag.moved, fromHandle=drag.fromHandle; const h=sheetPx(); drag=null;
  if(!moved){ if(fromHandle) setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); else sheet.classList.remove('dragging'); return; }
  const s=SNAP(); const best=Object.keys(s).reduce((a,k)=>Math.abs(s[k]-h)<Math.abs(s[a]-h)?k:a,'peek'); setSheet(best); }
[handle,head].forEach(el=>{ el.addEventListener('pointerdown',dragStart); });
sheet.addEventListener('pointermove',dragMove); sheet.addEventListener('pointerup',dragEnd); sheet.addEventListener('pointercancel',dragEnd);
handle.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); } });
const bodyEl=document.getElementById('body'); let bodyDrag=null;
bodyEl.addEventListener('pointerdown',e=>{ if(bodyEl.scrollTop<=0) bodyDrag={y:e.clientY,h:sheetPx()}; });
bodyEl.addEventListener('pointermove',e=>{ if(!bodyDrag) return; const dy=e.clientY-bodyDrag.y; if(dy>10 && bodyEl.scrollTop<=0){ sheet.classList.add('dragging'); sheet.style.height=Math.max(120,bodyDrag.h-dy)+'px'; } });
const bodyEnd=()=>{ if(!bodyDrag) return; const h=sheetPx(); bodyDrag=null; if(sheet.classList.contains('dragging')){ const s=SNAP(); const best=Object.keys(s).reduce((a,k)=>Math.abs(s[k]-h)<Math.abs(s[a]-h)?k:a,'peek'); setSheet(best); } };
bodyEl.addEventListener('pointerup',bodyEnd); bodyEl.addEventListener('pointercancel',bodyEnd);
addEventListener('resize',()=>setSheet(sheetState));

/* ===================== 조립 ===================== */
function recalc(){
  stopPlay();
  plan=buildPlan(state.day); detailPaths(plan);
  if(curT()<plan.t0||curT()>plan.t1) setT(plan.t0);
  renderDays(); renderChips(); renderTimeline(); renderItinerary(curT()); renderPlaceList();
  drawRoute(); drawCats(); tick();
  if(cardPlace) openCard(cardPlace);
  queueLegs();
}
function tick(){ const t=curT(); const p=drawNow(t)||posAt(plan,t); renderStatus(t,p); document.querySelectorAll('#it li[data-s]').forEach(li=>li.classList.toggle('now', t>=+li.dataset.s && t<+li.dataset.e)); }

plan=buildPlan(state.day); setSheet('peek'); renderDays(); renderCatFilter('cafe'); renderChips(); renderTimeline(); renderItinerary(curT()); renderStatus(curT(),posAt(plan,curT()));
(async()=>{
  const key=mapsKey();
  if(!key){ mapError('Google Maps API 키가 주입되지 않았습니다. GitHub 저장소 Secret(GOOGLE_MAPS_API_KEY)을 등록하고 Actions로 배포한 주소(…/tokyo.html)에서 열어 주세요. 일정표는 키 없이도 아래 패널에서 볼 수 있습니다.'); return; }
  try{ await loadGoogle(key); initMap(); recalc(); drawTrail(); renderTrailRow(); setTimeout(()=>fitTo(plan.stops),250); }
  catch(e){ mapError(e.message==='auth'?'Google Maps API 키 인증에 실패했습니다. 키 제한(리퍼러·API)과 Maps JavaScript API 사용 설정을 확인하세요.':'Google 지도 스크립트를 불러오지 못했습니다. 네트워크를 확인하거나, 배포된 주소(https://아이디.github.io/…/tokyo.html)에서 열어 주세요.'); }
})();
</script>
